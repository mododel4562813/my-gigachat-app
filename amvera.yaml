meta:
  version: "1.0"
  description: "Bot for Google Sheets and GigaChat"
  toolchain:
    language: "python"
    version: "3.10"
    name: "python-3.10"
  environment:
    variables:
      - name: "GOOGLE_CREDENTIALS_B64"
      - name: "GIGACHAT_TOKEN"
      - name: "GIGACHAT_CLIENT_ID"
      - name: "GIGACHAT_CLIENT_SECRET"

application:
  name: "pereproverim-bot"
  type: "python"
  python_version: "3.10"
  command: "python server.py"
  port: 8000

build:
  requirements: "requirements.txt"
