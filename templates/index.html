<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перепроверим — Не верь, а проверь</title>
    <!-- Шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           ВСТРОЕННЫЕ СТИЛИ (GLASSMORPHISM & DARK MODE)
           ========================================= */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1a1a1a;
            --accent: #6c5ce7;
            --danger: #ff7671;
            --success: #00cec9;
            --glass-border: rgba(255, 255, 255, 0.6);
        }

        body.dark {
            --bg-color: #1e1e2e;
            --card-bg: rgba(30, 30, 46, 0.9);
            --text-main: #ffffff;
            --accent: #a29bfe;
            --danger: #ff9f9a;
            --success: #54fcff;
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Manrope', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); transition: background 0.3s, color 0.3s; min-height: 100vh; }

        .background-blobs { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: -1; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.6; animation: float 10s infinite alternate; }
        .blob-1 { width: 300px; height: 300px; background: #ff7671; top: -50px; left: -50px; }
        .blob-2 { width: 400px; height: 400px; background: #6c5ce7; bottom: -50px; right: -50px; animation-delay: -2s; }
        .blob-3 { width: 200px; height: 200px; background: #00cec9; top: 30%; left: 40%; animation-duration: 15s; }

        @keyframes float { from { transform: translate(0, 0); } to { transform: translate(50px, 50px); } }

        .app-container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 40px; padding: 20px 0; }
        .logo { display: flex; align-items: center; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .logo h1 { font-size: 2.5rem; color: var(--accent); text-shadow: 0 0 10px rgba(108, 92, 231, 0.5); }
        .slogan { color: #666; margin-top: 10px; font-size: 1.1rem; }

        /* Glass Card */
        .glass-card { 
            background: var(--card-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; 
            padding: 30px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            position: relative;
        }

        /* Menu & Theme */
        .menu-btn, .theme-btn { 
            position: fixed; z-index: 100; padding: 12px; border-radius: 50%; 
            cursor: pointer; border: none; background: rgba(255,255,255,0.2); 
            color: white; font-size: 1.2rem; backdrop-filter: blur(5px);
        }
        .menu-btn { top: 20px; left: 20px; }
        .theme-btn { top: 20px; right: 20px; }
        .menu { 
            position: fixed; top: 70px; left: 20px; width: 220px; 
            background: var(--card-bg); border-radius: 15px; display: none; 
            flex-direction: column; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        .menu.open { display: block; }
        .menu a { padding: 15px 20px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid rgba(0,0,0,0.05); transition: 0.2s; }
        .menu a:hover, .menu a.active { background: var(--accent); color: white; }

        /* Tabs */
        .tab-panel { display: none; animation: fadeIn 0.4s ease; }
        .tab-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Hero Section */
        .hero-section { margin: 30px 0; text-align: center; }
        textarea#userText { 
            width: 100%; max-width: 600px; height: 100px; padding: 15px; 
            border-radius: 12px; border: 1px solid #ddd; resize: none; 
            font-size: 1rem; margin: 10px auto; outline: none;
        }
        button#checkBtn { 
            background: var(--accent); color: white; border: none; padding: 15px 40px; 
            border-radius: 50px; font-weight: 700; cursor: pointer; font-size: 1.1rem;
        }
        button#checkBtn:disabled { background: #ccc; }

        /* Result Block */
        .result { margin-top: 30px; border-left: 5px solid var(--accent); padding-left: 20px; }
        .verdict-badge { 
            display: inline-block; padding: 5px 15px; border-radius: 20px; 
            font-weight: bold; font-size: 0.9rem; margin-bottom: 15px;
        }
        .pravda { background: rgba(0,206,201,0.1); color: var(--success); border: 1px solid var(--success); }
        .mif { background: rgba(255,118,113,0.1); color: var(--danger); border: 1px solid var(--danger); }
        .sporno { background: rgba(243,175,0,0.1); color: #f3af00; border: 1px solid #f3af00; }

        /* Hearts Rating */
        .hearts { display: flex; gap: 5px; margin-top: 15px; cursor: pointer; }
        .heart { font-size: 1.5rem; opacity: 0.5; }
        .heart.active { opacity: 1; color: #ff4757; }

        /* Mascot */
        .mascot { display: flex; flex-direction: column-reverse; align-items: center; margin-top: 20px; }
        .mascot img { width: 150px; height: 150px; object-fit: contain; }
        .mascot-speech { background: white; padding: 10px 20px; border-radius: 20px; max-width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-top: -20px; position: relative; }
        .mascot-speech::after { content: ''; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); border-width: 10px 10px 0; border-style: solid; border-color: white transparent transparent transparent; }

        /* Forms & Inputs */
        input, textarea { padding: 12px; border-radius: 8px; border: 1px solid #ccc; width: 100%; margin-bottom: 15px; }
        input:focus, textarea:focus { outline: 2px solid var(--accent); }
        button.btn-secondary { background: transparent; border: 2px solid var(--accent); color: var(--accent); padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button.btn-secondary:hover { background: var(--accent); color: white; }
        button.btn-ghost { background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 10px; }

        /* Stats & Badges */
        .stats-header, .cabinet-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        .badges-grid, .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .badge { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--glass-border); }
        .badge.unlocked { border-color: var(--success); color: var(--success); }
        .badge-emoji { font-size: 1.5rem; display: block; margin-bottom: 5px; }

        /* Activity Chart */
        .activity-bars { display: flex; gap: 8px; height: 80px; align-items: flex-end; }
        .activity-bar { width: 20px; background: var(--accent); border-radius: 4px; transition: height 0.3s; }
        
        /* Footer */
        footer { text-align: center; padding: 40px; color: #888; font-size: 0.9rem; margin-top: 40px; }

        /* Hidden class */
        .hidden { display: none !important; }
    </style>

    <script>
        // ========================================================
        // MOCK DATA & API STUBS (Заглушки для работы без сервера)
        // ========================================================
        const MOCK_DATA = {
            "vaccines cause autism": { verdict: "МИФ", explanation: "Многочисленные исследования с участием миллионов детей не нашли связи между вакцинами и аутизмом. Первоначальное исследование было отозвано из-за фальсификации данных." },
            "cold weather gives you a cold": { verdict: "ПРАВДА", explanation: "Вирус простуды легче передается в холодную погоду, и холодный воздух может ослаблять местный иммунитет в носу." },
            "sugar makes kids hyper": { verdict: "СПОРНО", explanation: "Исследования не показывают прямого влияния сахара на гиперактивность. Эффект часто связан с контекстом (праздники, подарки)." }
        };

        function mockApiCheck(text) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const lower = text.toLowerCase();
                    if (MOCK_DATA[lower]) {
                        resolve(MOCK_DATA[lower]);
                    } else {
                        const randomVerdicts = ["ПРАВДА", "МИФ"];
                        resolve({
                            verdict: randomVerdicts[Math.floor(Math.random() * randomVerdicts.length)],
                            explanation: "Это демонстрационный ответ. В реальной версии мы бы обратились к научным базам данных (PubMed, Cochrane)."
                        });
                    }
                }, 800);
            });
        }

        function mockApiGame() {

                { q: "Чеснок убивает вирусы гриппа", a: "МИФ" },
                { q: "Сон менее 6 часов повышает риск болезней сердца", a: "ПРАВДА" },
                { q: "Кофе вызывает рак", a: "МИФ" }
            ];
            return statements[Math.floor(Math.random() * statements.length)];
        }

        // ========================================================
        // ОСНОВНОЙ СКРИПТ (ТВОЕГО ОРИГИНАЛА + ИСПРАВЛЕНИЯ)
        // ========================================================

        // --- ТЕМА ---
        const themeBtn = document.getElementById('themeBtn');
        function applyTheme(theme) {
            document.body.classList.toggle('dark', theme === 'dark');
            document.documentElement.classList.remove('dark-preload');
            if (themeBtn) themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        let savedTheme = 'light';
        try {
            savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        applyTheme(savedTheme);

        if (themeBtn) {
            themeBtn.addEventListener('click', function () {
                const newTheme = document.body.classList.contains('dark') ? 'light' : 'dark';
                applyTheme(newTheme);
                try { localStorage.setItem('theme', newTheme); } catch (e) {}
            });
        }

        // --- МЕНЮ И ВКЛАДКИ ---
        const menuBtn = document.getElementById('menuBtn');
        const menuEl = document.getElementById('menu');

        function toggleMenu() { if (menuEl) menuEl.classList.toggle('open'); }
        function closeMenu() { if (menuEl) menuEl.classList.remove('open'); }
